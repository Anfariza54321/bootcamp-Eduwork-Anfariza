<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anfariza's Shop</title>

    <!-- Bootsrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg bg-secondary pt-2 navbar-dark sticky-top"
    >
      <div class="container d-flex justify-content-center">
        <h1>
          <a href="#" class="navbar-brand">Anfariza'S</a>
        </h1>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar m-auto d-flex flex-sm-column flex-lg-row">
            <li class="nav-item m-3 list-group-item border-white border-bottom">
              <a href="#" class="text-decoration-none active">Home</a>
            </li>
            <li class="nav-item m-3 list-group-item border-white border-bottom">
              <a href="#" class="text-decoration-none">Product</a>
            </li>
            <li class="nav-item m-3 list-group-item border-white border-bottom">
              <a href="#" class="text-decoration-none">Category</a>
            </li>
            <li class="nav-item m-3 list-group-item border-white border-bottom">
              <a href="#" class="text-decoration-none">About</a>
            </li>
            <li class="nav-item m-3 list-group-item border-white border-bottom">
              <a href="#" class="text-decoration-none">Contact Us</a>
            </li>
          </ul>
        </div>

        <div class="ms-auto position-relative">
          <h4>
            <a href="javascript:void(0)"><i class="bi bi-search"></i></a>
            <a href="javascript:void(0)"
              ><i class="bi bi-person-circle m-4"></i
            ></a>
            <a href="javascript:void(0)" onclick="bukaKeranjang()"
              ><i class="bi bi-cart4"></i
              ><span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                id="jumlah-keranjang"
                >0</span
              ></a
            >
          </h4>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <section
      class="hero d-flex"
      style="min-height: 100vh; display: flex; align-items: center"
    >
      <div class="container flex-lg-row flex-sm-column">
        <div class="justify-content-center col-lg-3">
          <h1 class="fw-bold text-start">
            Exclusive Deals of Shoes Collection
          </h1>
          <p class="py-3">Explore different categories. find the best deals</p>
          <button
            class="btn btn-dark fw-bold border border-0 rounded text-start"
          >
            Shop Now
          </button>
        </div>
        <div class=""></div>
      </div>
    </section>

    <!-- Category -->
    <section
      class="bg-light d-flex"
      style="min-height: 100vh; display: flex; align-items: center"
    >
      <div class="container">
        <h1 class="fw-bold text-center mb-3">Choose Your Favourite</h1>
        <div class="d-flex">
          <div class="side-bar col-lg-3 text-start">
            <input
              type="text"
              id="searchInput"
              onkeyup="cariSepatu()"
              placeholder="Search"
              class="textInput p-2 rounded border-top-0"
            />
            <div class="py-4">
              <ul class="text-start">
                <li
                  class="list-group-item side-bar-item"
                  onclick="filterSepatu('adidas')"
                >
                  Adidas
                </li>
                <li
                  class="list-group-item py-4 side-bar-item"
                  onclick="filterSepatu('nike')"
                >
                  Nike
                </li>
                <li
                  class="list-group-item side-bar-item"
                  onclick="filterSepatu('puma')"
                >
                  Puma
                </li>
                <li
                  class="list-group-item py-4 side-bar-item"
                  onclick="filterSepatu('reebok')"
                >
                  Rebook
                </li>
                <li
                  class="list-group-item side-bar-item"
                  onclick="filterSepatu('vans')"
                >
                  Vans
                </li>
                <li
                  class="list-group-item py-4 side-bar-item"
                  onclick="filterSepatu('ortuseight')"
                >
                  OrtusEight
                </li>
                <li
                  class="list-group-item side-bar-item"
                  onclick="filterSepatu('aerostreet')"
                >
                  Aerostreet
                </li>
              </ul>
            </div>
            <button
              class="categories btn btn-dark"
              onclick="filterSepatu('all')"
            >
              All Categories <i class="bi bi-arrow-right"></i>
            </button>
          </div>

          <div class="container col-lg-9">
            <div class="row" id="produkList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal -->
    <div
      class="modal fade"
      id="modalKeranjang"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Keranjang Belanja</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="isiModalKeranjang"></div>
          <div class="modal-footer">
            <h5 class="me-auto" id="totalBelanja">Total: Rp 0</h5>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Tutup
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="prosesCheckout()"
            >
              Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
